# =============================================================================
# Odoo Kubernetes Deployment Configuration
# =============================================================================
#
# IMPORTANT: Host Directory Permissions Setup
# -------------------------------------------
# This configuration uses hostPath volumes which require proper ownership on the host.
# Before deploying, ensure the following directories exist with correct permissions:
#
# 1. SSH to the Kubernetes node (beefy1 in this case):
#    ssh user@192.168.0.100
#
# 2. Create directories and set ownership:
#    sudo mkdir -p /data/mint-postgres /data/mint-odoo
#    sudo chown 999:999 /data/mint-postgres    # PostgreSQL runs as UID/GID 999
#    sudo chown 999:999 /data/mint-odoo        # Custom OCB image also uses UID/GID 999
#    sudo chmod 755 /data/mint-postgres /data/mint-odoo
#
# 3. Verify permissions:
#    ls -la /data/
#    # Should show:
#    # drwxr-xr-x 2 999 docker 4096 ... mint-postgres/
#    # drwxr-xr-x 2 999 docker 4096 ... mint-odoo/
#
# Note: Mintsystems Odoo Image (mintsystem/odoo:18.0)
# ---------------------------------------------------
# This deployment uses the official Mintsystems Odoo image which includes:
# - Odoo 18.0 Community Edition with latest updates
# - Optimized build process with uv package manager
# - Standard Odoo directory structure: /var/lib/odoo, /mnt/extra-addons
# - Environment variable-based configuration
# - Built-in health checks and non-root execution
# - Support for git-based addon repositories
#
# Namespace: mint-odoo
# ------------------
# All resources are deployed in the 'mint-odoo' namespace for better organization
#
# Alternative Storage Solutions:
# -----------------------------
# For production environments, consider using:
# - NFS with proper UID/GID mapping
# - Cloud storage (AWS EBS, GCP PD, Azure Disk)
# - Ceph RBD or CephFS
# - Local provisioner with proper node selectors
#
# Security Context Notes:
# ----------------------
# This deployment uses "restricted" pod security policy which requires:
# - seccompProfile: RuntimeDefault for all containers
# - runAsNonRoot: true
# - allowPrivilegeEscalation: false
# - capabilities.drop: ["ALL"]
# - Resource limits for all containers (including init containers)
#
# Database Initialization:
# ------------------------
# The Odoo container includes "--init=base" parameter for first-time setup.
# After initial deployment, you may want to remove this parameter to avoid
# reinstalling base modules on restarts.
#
# Access Information:
# ------------------
# - Odoo Web Interface: http://<node-ip>:30070
# - Database: PostgreSQL accessible internally at mint-postgres-service:5432
# - Default database name: odoo
# - Default database user: odoo
# - Namespace: mint-odoo (isolated from existing odoo namespace)
# =============================================================================

# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: mint-odoo
  labels:
    name: mint-odoo
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

---
# PostgreSQL Secret
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: mint-odoo
type: Opaque
stringData:
  postgres-password: "odoo_secure_password_2025"
  postgres-user: "odoo"
  postgres-db: "odoo"

---
# PostgreSQL ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: mint-odoo
  labels:
    app: postgres
data:
  POSTGRES_DB: "odoo"
  POSTGRES_USER: "odoo"
  PGDATA: "/var/lib/postgresql/data/pgdata"
  
---
# Odoo ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: odoo-config
  namespace: mint-odoo
  labels:
    app: odoo
data:
  HOST: "mint-postgres-service"
  USER: "odoo"
  DB_PORT: "5432"
  odoo.conf: |
    [options]
    addons_path = /opt/odoo/addons,/mnt/extra-addons
    data_dir = /var/lib/odoo
    xmlrpc_port = 8069
    workers = 0
    max_cron_threads = 1
    limit_memory_hard = 2684354560
    limit_memory_soft = 2147483648
    limit_time_cpu = 600
    limit_time_real = 1200
    log_level = info

---
# PostgreSQL Persistent Volume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mint-postgres-pv
  labels:
    type: local
spec:
  storageClassName: nfs-csi
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: "/data/mint-postgres"

---
# PostgreSQL Persistent Volume Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mint-postgres-pvc
  namespace: mint-odoo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 20Gi

---
# Odoo Data Persistent Volume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mint-odoo-data-pv
  labels:
    type: local
spec:
  storageClassName: nfs-csi
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: "/data/mint-odoo"

---
# Odoo Data Persistent Volume Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mint-odoo-data-pvc
  namespace: mint-odoo
spec:
  storageClassName: nfs-csi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
---
# PostgreSQL Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mint-postgres-sa
  namespace: mint-odoo
automountServiceAccountToken: false

---
# Odoo Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mint-odoo-sa
  namespace: mint-odoo
automountServiceAccountToken: false

---
# PostgreSQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mint-postgres
  namespace: mint-odoo
  labels:
    app: mint-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mint-postgres
  template:
    metadata:
      labels:
        app: mint-postgres
    spec:
      serviceAccountName: mint-postgres-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: volume-setup
        image: postgres:15.5
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        command:
        - sh
        - -c
        - |
          echo "Setting up PostgreSQL data directory..."
          if [ ! -d "/var/lib/postgresql/data/pgdata" ]; then
            echo "Creating pgdata directory..."
            mkdir -p /var/lib/postgresql/data/pgdata
          fi
          echo "PostgreSQL directory setup complete"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
      containers:
      - name: postgres
        image: postgres:15.5
        securityContext:
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: postgres-password
        - name: PGDATA
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: PGDATA
        ports:
        - containerPort: 5432
          name: postgres
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: tmp-volume
          mountPath: /tmp
        - name: run-volume
          mountPath: /var/run/postgresql
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - odoo
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - odoo
          initialDelaySeconds: 15
          periodSeconds: 5
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: mint-postgres-pvc
      - name: tmp-volume
        emptyDir: {}
      - name: run-volume
        emptyDir: {}

---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: mint-postgres-service
  namespace: mint-odoo
  labels:
    app: mint-postgres
spec:
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: mint-postgres
  type: ClusterIP

---
# Odoo Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mint-odoo
  namespace: mint-odoo
  labels:
    app: mint-odoo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mint-odoo
  template:
    metadata:
      labels:
        app: mint-odoo
    spec:
      serviceAccountName: mint-odoo-sa
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: wait-for-postgres
        image: postgres:15.5
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        command:
        - sh
        - -c
        - |
          until pg_isready -h mint-postgres-service -U odoo; do
            echo "Waiting for PostgreSQL to be ready..."
            sleep 2
          done
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: postgres-password
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
      containers:
      - name: odoo
        image: mintsystem/odoo:18.0
        imagePullPolicy: Always
        securityContext:
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 8069
          name: odoo-web
        env:
        - name: PGHOST
          valueFrom:
            configMapKeyRef:
              name: odoo-config
              key: HOST
        - name: PGUSER
          valueFrom:
            configMapKeyRef:
              name: odoo-config
              key: USER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: postgres-password
        - name: PGPORT
          valueFrom:
            configMapKeyRef:
              name: odoo-config
              key: DB_PORT
        - name: ODOO_DATABASE
          value: "odoo"
        - name: ODOO_INIT_LOGIN
          value: "admin"
        - name: ODOO_INIT_PASSWORD
          value: "admin"
        - name: ODOO_INIT_ADDONS
          value: "base"
        volumeMounts:
        - name: odoo-data
          mountPath: /var/lib/odoo
        - name: extra-addons
          mountPath: /mnt/extra-addons
        - name: odoo-config-file
          mountPath: /etc/odoo
        - name: tmp-volume
          mountPath: /tmp
        resources:
          requests:
            cpu: "1000m"
            memory: "2Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        livenessProbe:
          httpGet:
            path: /web/health
            port: 8069
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /web/health
            port: 8069
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: odoo-data
        persistentVolumeClaim:
          claimName: mint-odoo-data-pvc
      - name: extra-addons
        hostPath:
          path: /home/christian/develop/civitask/odoo-modules
          type: Directory
      - name: odoo-config-file
        configMap:
          name: odoo-config
      - name: tmp-volume
        emptyDir: {}

---
# Odoo Service with NodePort 30069
apiVersion: v1
kind: Service
metadata:
  name: mint-odoo-service
  namespace: mint-odoo
  labels:
    app: mint-odoo
spec:
  type: NodePort
  ports:
  - port: 8069
    targetPort: 8069
    nodePort: 30070
    protocol: TCP
    name: odoo-web
  selector:
    app: mint-odoo

---
# Network Policy for Security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mint-odoo-network-policy
  namespace: mint-odoo
spec:
  podSelector:
    matchLabels:
      app: mint-odoo
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from: []
    ports:
    - protocol: TCP
      port: 8069
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: mint-postgres
    ports:
    - protocol: TCP
      port: 5432
  - to: []
    ports:
    - protocol: TCP
      port: 443  # HTTPS outbound
    - protocol: UDP
      port: 53   # DNS

---
# Resource Quota
apiVersion: v1
kind: ResourceQuota
metadata:
  name: mint-odoo-quota
  namespace: mint-odoo
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "10"